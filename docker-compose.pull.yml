# Deployment without a compiler on the server.
#
#   IMAGE_TAG=<sha> docker compose -f docker-compose.yml -f docker-compose.pull.yml pull
#   IMAGE_TAG=<sha> docker compose -f docker-compose.yml -f docker-compose.pull.yml up -d
#
# A thin override rather than a copy of the stack: `build: !reset null` drops the build context
# declared in docker-compose.yml and `image` names the published one. Ports, health checks,
# volumes and environment are inherited, so the two files cannot drift apart.
#
# CI publishes both images from main in .github/workflows/images.yml. Pin IMAGE_TAG to a commit
# sha: "latest" moves, a sha does not, and a rollback is the previous sha.

services:
  migrate:
    build: !reset null
    image: ghcr.io/indraoverflow/shopee-digital-delivery/api:${IMAGE_TAG:-latest}

  api:
    build: !reset null
    image: ghcr.io/indraoverflow/shopee-digital-delivery/api:${IMAGE_TAG:-latest}

  worker:
    build: !reset null
    image: ghcr.io/indraoverflow/shopee-digital-delivery/api:${IMAGE_TAG:-latest}

  web:
    build: !reset null
    image: ghcr.io/indraoverflow/shopee-digital-delivery/web:${IMAGE_TAG:-latest}
