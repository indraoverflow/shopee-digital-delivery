# Sandbox API for the Shopee partner application.
#
# Shopee registers two redirect domains, one per environment. SHOPEE_ENV decides the Shopee
# host at boot, so one process cannot answer both: a sandbox `code` exchanged against the
# production host fails with exchange_failed and no useful message in the console. Two
# processes from the same image is the honest arrangement, about 25 MB.
#
#   docker compose -f docker-compose.yml -f docker-compose.cloudflare-tunnel.yml \
#     -f docker-compose.shopee-sandbox.yml up -d
#
# The service extends the live api definition instead of copying it, so the database URL,
# the keys, the volumes and the health check stay in one place. Only the Shopee environment
# and the redirect URL differ. Stores connected through it are stored with environment
# SANDBOX, so a sandbox shop can never be mistaken for a real one.

services:
  api-sandbox:
    extends:
      file: docker-compose.yml
      service: api
    environment:
      # The whole point of this service: same code, Shopee's test environment.
      SHOPEE_ENV: sandbox
      # Inheriting fixture mode would make this container a very convincing demo: it would
      # answer every call from fixtures and never touch Shopee, which is the opposite of
      # what a sandbox API is for.
      SHOPEE_GATEWAY_MODE: live
      SHOPEE_REDIRECT_URL: https://sandbox-api.example.com/api/integration/shopee/callback
    # The live api already publishes the host port, so drop the inherited mapping. This
    # service is reached only through the tunnel, over the compose network.
    ports: !reset []
