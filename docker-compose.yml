# Production-ish stack: PostgreSQL, a one-shot migrator, the API, the worker,
# the web app, and an optional nginx for the three public hostnames.
#
#   cp .env.example .env && edit
#   docker compose up -d --build
#   docker compose --profile proxy up -d      # add nginx
#
# The web app proxies /api/backend to the API over the compose network, so the
# browser only ever talks to claim./admin. and the session cookie stays
# first-party.

name: qansa-delivery

services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-qansa}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-qansa}
      POSTGRES_DB: ${POSTGRES_DB:-qansa_delivery}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-qansa} -d ${POSTGRES_DB:-qansa_delivery}"]
      interval: 5s
      timeout: 5s
      retries: 12
    ports:
      - "127.0.0.1:${POSTGRES_HOST_PORT:-55433}:5432"

  migrate:
    build:
      context: .
      dockerfile: docker/api.Dockerfile
    command: ["node", "apps/api/dist/bootstrap.js"]
    env_file: [.env]
    environment:
      NODE_ENV: production
      DATABASE_URL: postgres://${POSTGRES_USER:-qansa}:${POSTGRES_PASSWORD:-qansa}@postgres:5432/${POSTGRES_DB:-qansa_delivery}
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  api:
    build:
      context: .
      dockerfile: docker/api.Dockerfile
    restart: unless-stopped
    env_file: [.env]
    environment:
      NODE_ENV: production
      DATABASE_URL: postgres://${POSTGRES_USER:-qansa}:${POSTGRES_PASSWORD:-qansa}@postgres:5432/${POSTGRES_DB:-qansa_delivery}
      MIGRATIONS_DIR: /app/migrations
    depends_on:
      migrate:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
    volumes:
      - uploads:/data/uploads
    ports:
      - "127.0.0.1:${API_HOST_PORT:-4000}:4000"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:4000/health"]
      interval: 10s
      timeout: 5s
      retries: 6

  worker:
    build:
      context: .
      dockerfile: docker/api.Dockerfile
    command: ["node", "apps/worker/dist/main.js"]
    restart: unless-stopped
    env_file: [.env]
    environment:
      NODE_ENV: production
      DATABASE_URL: postgres://${POSTGRES_USER:-qansa}:${POSTGRES_PASSWORD:-qansa}@postgres:5432/${POSTGRES_DB:-qansa_delivery}
      MIGRATIONS_DIR: /app/migrations
    depends_on:
      migrate:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
    volumes:
      - uploads:/data/uploads

  web:
    build:
      context: .
      dockerfile: docker/web.Dockerfile
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: "3000"
      HOSTNAME: 0.0.0.0
      API_URL: http://api:4000
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "127.0.0.1:${WEB_HOST_PORT:-3000}:3000"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:3000/"]
      interval: 15s
      timeout: 5s
      retries: 6

  nginx:
    image: nginx:1.27-alpine
    profiles: ["proxy"]
    restart: unless-stopped
    volumes:
      - ./docker/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on: [api, web]
    ports:
      - "8080:80"

volumes:
  postgres-data:
  uploads:
