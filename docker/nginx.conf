# Reverse proxy for the three public hostnames. TLS terminates here (or at the
# Cloudflare tunnel); the containers only speak plain HTTP on the docker network.
#
# Rate limiting lives here as well as in the API: nginx sheds a flood before it
# reaches Node, and the API still enforces per-route limits for the cases nginx
# cannot see (one IP behind a shared NAT, a single buyer retrying).

upstream qansa_api { server api:4000; }
upstream qansa_web { server web:3000; }

# 10 requests per second per IP, burst 20: generous for a buyer, tight for a script.
limit_req_zone $binary_remote_addr zone=claim_zone:10m rate=10r/s;
# The console is used by humans, a couple of requests per second at most.
limit_req_zone $binary_remote_addr zone=console_zone:10m rate=30r/s;
# Login and the 2FA challenge get their own, much tighter bucket.
limit_req_zone $binary_remote_addr zone=auth_zone:10m rate=1r/s;

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    server_name api.qansa.web.id;

    # Digital product uploads are capped at 50 MB; leave room for multipart overhead.
    client_max_body_size 60m;

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    location /api/integration/shopee/push {
        # Shopee pushes are machine traffic: no rate limit, but the signature is
        # verified against the raw body before anything is stored.
        proxy_pass http://qansa_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
    }

    location /api/auth/ {
        limit_req zone=auth_zone burst=5 nodelay;
        limit_req_status 429;
        proxy_pass http://qansa_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        limit_req zone=claim_zone burst=20 nodelay;
        limit_req_status 429;
        proxy_pass http://qansa_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }
}

# Buyer portal. No cookies beyond the claim session, no uploads.
server {
    listen 80;
    server_name claim.qansa.web.id;

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    location / {
        limit_req zone=claim_zone burst=30 nodelay;
        limit_req_status 429;
        proxy_pass http://qansa_web;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
    }
}

# Operator console. Restrict further with `allow`/`deny` if the team has a fixed
# address: the API's ADMIN_IP_ALLOWLIST does the same thing one layer deeper.
server {
    listen 80;
    server_name admin.qansa.web.id;

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header X-Robots-Tag "noindex, nofollow" always;

    location / {
        limit_req zone=console_zone burst=40 nodelay;
        limit_req_status 429;
        # allow 203.0.113.10;
        # deny all;

        proxy_pass http://qansa_web;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
    }
}
