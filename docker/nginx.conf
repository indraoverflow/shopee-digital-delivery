# Reverse proxy for the three public hostnames. TLS terminates here (or at the
# Cloudflare tunnel); the containers only speak plain HTTP on the docker network.
upstream qansa_api { server api:4000; }
upstream qansa_web { server web:3000; }

server {
    listen 80;
    server_name api.qansa.web.id;

    client_max_body_size 60m;

    location / {
        proxy_pass http://qansa_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }
}

server {
    listen 80;
    server_name claim.qansa.web.id admin.qansa.web.id;

    location / {
        proxy_pass http://qansa_web;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
    }
}
